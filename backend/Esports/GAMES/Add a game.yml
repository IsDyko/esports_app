info:
  name: Add a game
  type: http
  seq: 1

http:
  method: POST
  url: '{{baseURL}}/games'
  body:
    type: json
    data: |-
      {
        "name": "Rainbow Six Siege",
        "slug": "rainbow-six-siege"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
